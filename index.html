<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Excel Dashboard</title>
</head>
<body>
<h1>Excel Data</h1>
<pre id="output"></pre>
<script>
fetch('data/data.json')
.then(res => res.json())
.then(data => {
  document.getElementById('output').textContent = JSON.stringify(data, null, 2);
});
</script>
</body>
</html>
